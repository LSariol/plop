<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plop Setup</title>
  <style>
    :root {
      --primary: #7B6FE8;
      --bg:      #0F0F13;
      --card:    #1C1C28;
      --text:    #E8E6F2;
      --muted:   #5C587A;
      --border:  #2A2A3E;
      --error:   #E05555;
      --success: #4E9070;
      --radius:  14px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.40);
    }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.3rem; }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; line-height: 1.5; }
    .field { margin-bottom: 1.25rem; }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.4rem;
    }
    input {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      color: var(--text);
      background: #16161E;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: var(--primary); background: #16161E; }
    .hint { font-size: 0.8rem; color: var(--muted); margin-top: 0.4rem; line-height: 1.4; }
    button {
      width: 100%;
      padding: 0.85rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: opacity 0.15s;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .msg {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.9rem;
      line-height: 1.5;
      display: none;
    }
    .msg.error   { background: rgba(224,85,85,0.12);  color: var(--error);   display: block; }
    .msg.success { background: rgba(78,144,112,0.12); color: var(--success); display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to Plop</h1>
    <p class="subtitle">Connect this PC to your account to start receiving files and messages.</p>

    <div class="field">
      <label for="server_url">Server URL</label>
      <input id="server_url" type="url" placeholder="https://plop.example.com" value="{{.ServerURL}}" required>
    </div>

    <div class="field">
      <label for="machine_name">Machine Name</label>
      <input id="machine_name" type="text" placeholder="My PC" value="{{.MachineName}}" required>
      <p class="hint">How this PC will appear in your Settings page.</p>
    </div>

    <div class="field">
      <label for="default_folder">Download Folder</label>
      <input id="default_folder" type="text" placeholder="C:\Users\You\Desktop\Plop">
      <p class="hint">Where received files will be saved by default.</p>
    </div>

    <div class="field">
      <label for="pairing_code">Pairing Code</label>
      <input id="pairing_code" type="text" placeholder="XXXX XXXX" autocomplete="off" required>
      <p class="hint">Generate this from the Plop app &rarr; Settings &rarr; Pair a New Desktop.</p>
    </div>

    <button id="connectBtn">Connect</button>
    <div id="msg" class="msg"></div>
  </div>

  <script>
    (function prefillFolder() {
      const el = document.getElementById('default_folder');
      if (!el.value) {
        const username = (navigator.userAgent.match(/Windows NT/) ? 'You' : 'you');
        el.placeholder = 'C:\\Users\\' + username + '\\Desktop\\Plop';
      }
    })();

    document.getElementById('connectBtn').addEventListener('click', async () => {
      const btn = document.getElementById('connectBtn');
      const msg = document.getElementById('msg');
      msg.className = 'msg';

      const serverURL     = document.getElementById('server_url').value.trim();
      const machineName   = document.getElementById('machine_name').value.trim();
      const pairingCode   = document.getElementById('pairing_code').value.trim();
      const defaultFolder = document.getElementById('default_folder').value.trim();

      if (!serverURL || !machineName || !pairingCode) {
        msg.className = 'msg error';
        msg.textContent = 'Server URL, Machine Name, and Pairing Code are required.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Connecting…';

      try {
        const res = await fetch('/setup', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ server_url: serverURL, machine_name: machineName, pairing_code: pairingCode, default_folder: defaultFolder }),
        });
        const data = await res.json();
        if (!res.ok) {
          msg.className   = 'msg error';
          msg.textContent = data.error || 'Something went wrong. Try again.';
          btn.disabled    = false;
          btn.textContent = 'Connect';
          return;
        }
        msg.className   = 'msg success';
        msg.textContent = '✓ Connected! Plop is now running in your system tray. You can close this window.';
        btn.textContent = 'Done';
      } catch (_) {
        msg.className   = 'msg error';
        msg.textContent = 'Could not reach the setup server. Please restart Plop.';
        btn.disabled    = false;
        btn.textContent = 'Connect';
      }
    });
  </script>
</body>
</html>
