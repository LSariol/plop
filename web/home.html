<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Plop — send photos, notes, and files from your phone straight to your desktop.">
  <meta name="theme-color" content="#5B4FD9">
  <title>Plop</title>
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <img class="header-logo" src="/static/icons/plop1.png" alt="Plop logo">
      <h1 class="header-title">Plop</h1>
    </div>
  </header>

  <div class="page-wrapper">
    <section class="hero">
      <img class="hero-logo" src="/static/icons/plop1.png" alt="">
      <p class="hero-title">Drop it on your desktop</p>
      <p class="hero-copy">
        Send photos, notes, and files from your phone straight to your
        Windows desktop. Fast, private, and made for you and your friends.
      </p>
    </section>

    <div class="card">
      <div class="action-group">
        <a href="/login" class="btn">Login</a>
        <a href="/create-account" class="btn btn-outline">Create Account</a>
      </div>
    </div>
  </div>

  <footer>Plop · warm, quick, and personal</footer>
</body>
</html>
